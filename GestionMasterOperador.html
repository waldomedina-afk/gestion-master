<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gestión Master — Operador</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap');
  :root{
    --bg:#0A1628;--surface:#111F35;--card:#162540;--border:#1E3A5F;
    --accent:#00B4D8;--accent2:#F59E0B;--danger:#EF4444;--ok:#22C55E;
    --text:#E2E8F0;--muted:#64748B;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overflow-x:hidden}

  /* HEADER */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
  .brand{font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.5px}
  .brand span{color:var(--text);font-weight:300}
  .sync-info{margin-left:auto;font-size:10px;color:var(--muted);font-family:var(--mono);text-align:right;line-height:1.5}

  /* NAV BOTTOM */
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;font-size:10px;color:var(--muted);border:none;background:none;font-family:var(--sans);transition:color .15s}
  .nav-btn.active{color:var(--accent)}
  .nav-btn .icon{font-size:20px}

  main{padding:12px;max-width:600px;margin:0 auto;padding-bottom:80px}

  /* CARDS */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;animation:fadeUp .25s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .card-title{font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;margin-bottom:12px}

  /* BUTTONS */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:8px;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:600;transition:all .15s}
  .btn:active{transform:scale(.97)}
  .btn+.btn{margin-top:8px}
  .btn-primary{background:var(--accent);color:#000}
  .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-google{background:#fff;color:#333;border:1px solid #ddd}

  /* SEARCH */
  .search-wrap{position:relative}
  .search-wrap input{width:100%;padding:12px 16px 12px 42px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;font-family:var(--sans);outline:none;transition:border-color .2s}
  .search-wrap input:focus{border-color:var(--accent)}
  .search-wrap input::placeholder{color:var(--muted)}
  .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none}

  /* LIST ITEMS */
  .list-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .list-item:active{border-color:var(--accent)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

  /* SALDOS */
  .saldo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .saldo-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
  .saldo-cuenta{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .saldo-monto{font-size:18px;font-weight:700;font-family:var(--mono)}
  .saldo-monto.pos{color:var(--ok)}.saldo-monto.neg{color:var(--danger)}
  .saldo-usd{font-size:13px;color:#81D4FA;font-family:var(--mono);margin-top:2px}

  /* CUOTA ROWS */
  .cuota-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:10px}
  .cuota-row:last-child{border-bottom:none}
  .cuota-num{font-family:var(--mono);font-size:11px;color:var(--muted);width:26px;flex-shrink:0;text-align:center}
  .cuota-info{flex:1;min-width:0}
  .cuota-venc{font-size:11px;color:var(--muted)}
  .cuota-monto-txt{font-size:14px;font-weight:600}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0}
  .badge-ok{background:#0A2E1A;color:var(--ok)}
  .badge-pend{background:#0A1F3A;color:var(--accent)}
  .badge-venc{background:#2E0A0A;color:var(--danger)}
  .badge-parc{background:#2E1E0A;color:var(--accent2)}
  .badge-hoy{background:#2E2400;color:#FFD54F}
  .badge-grey{background:#1a1a2e;color:var(--muted)}

  /* CREDITO EXPAND */
  .credito-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .credito-hdr{padding:13px 15px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid transparent;transition:border-color .2s}
  .credito-hdr.open{border-bottom-color:var(--border)}
  .credito-id{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface);padding:2px 7px;border-radius:4px}
  .credito-monto{font-weight:700;font-size:15px}
  .credito-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .credito-badge{margin-left:auto;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;flex-shrink:0}
  .badge-activo{background:#0A2E1A;color:var(--ok)}
  .badge-cancelado{background:#1a1a2e;color:var(--muted)}
  .badge-vencido2{background:#2E0A0A;color:var(--danger)}
  .chev{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0}
  .chev.open{transform:rotate(180deg)}

  /* RESUMEN */
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .res-item{background:var(--surface);border-radius:8px;padding:10px 12px}
  .res-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .res-val{font-size:16px;font-weight:700;margin-top:3px;font-family:var(--mono)}
  .res-val.ok{color:var(--ok)}.res-val.danger{color:var(--danger)}.res-val.accent{color:var(--accent2)}

  /* SIMULADOR */
  .sim-input-wrap{margin-bottom:10px}
  .sim-label{font-size:11px;color:var(--muted);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.8px}
  .sim-input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;transition:border-color .2s}
  .sim-input:focus{border-color:var(--accent)}
  .sim-result{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px}
  .sim-cuota-big{font-size:28px;font-weight:700;color:var(--accent);font-family:var(--mono);text-align:center;margin:8px 0}
  .sim-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  .sim-table th{color:var(--muted);font-weight:600;padding:6px 4px;text-align:right;border-bottom:1px solid var(--border);font-size:10px;letter-spacing:.5px}
  .sim-table th:first-child{text-align:left}
  .sim-table td{padding:7px 4px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--mono)}
  .sim-table td:first-child{text-align:left;color:var(--muted)}
  .sim-table tr:last-child td{border-bottom:none}

  /* PAGARES */
  .pagare-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:6px}
  .pagare-estado{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:6px}
  .pe-llevar{background:#2E1E0A;color:var(--accent2)}
  .pe-cliente{background:#0A1F3A;color:var(--accent)}
  .pe-firmado{background:#0A2E1A;color:var(--ok)}
  .pe-perdido{background:#2E0A0A;color:var(--danger)}

  /* ESPERA */
  .espera-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:6px}
  .espera-prog{height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
  .espera-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

  /* MISC */
  .back-btn{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:14px}
  .empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px}
  .empty-icon{font-size:38px;margin-bottom:8px}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:28px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 18px;font-size:13px;transition:transform .3s;z-index:999;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .progress-bar{height:3px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .4s;border-radius:2px}
  #filePicker{display:none}
  .section{display:none}.section.active{display:block}
  .pill-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .pill{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s}
  .pill.on{background:var(--accent);color:#000;border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <div style="font-size:20px">💼</div>
  <div class="brand">GESTIÓN <span>MASTER</span></div>
  <div class="sync-info" id="syncInfo">Sin conexión</div>
</header>

<main id="main">
  <!-- LOGIN -->
  <div id="secLogin" class="section active">
    <div class="card" style="margin-top:20px">
      <div class="card-title">🔐 Acceso</div>
      <button class="btn btn-google" onclick="iniciarGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.5 30.2 0 24 0 14.6 0 6.6 5.5 2.7 13.5l7.8 6C12.4 13.1 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/><path fill="#FBBC05" d="M10.5 28.5c-.5-1.5-.8-3-.8-4.5s.3-3 .8-4.5l-7.8-6C1 16.5 0 20.1 0 24s1 7.5 2.7 10.5l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-7.8 6C6.6 42.5 14.6 48 24 48z"/></svg>
        Conectar con Google Drive
      </button>
      <button class="btn btn-secondary" onclick="document.getElementById('filePicker').click()">
        📁 Cargar archivo .db manualmente
      </button>
      <input type="file" id="filePicker" accept=".db,.sqlite,.sqlite3" onchange="cargarDBArchivo(event)">
      <div id="progressWrap" style="display:none">
        <div style="font-size:12px;color:var(--muted);margin-top:10px;text-align:center" id="progressMsg"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <!-- AGREGADO 2026-11-04, a pedido de Waldo: consulta BCRA por DNI antes del login (sin necesidad de Drive) -->
    <div class="card">
      <div class="card-title">🏛 Consultar BCRA por DNI</div>
      <div style="display:flex;gap:8px">
        <input id="bcraDni" type="tel" inputmode="numeric" maxlength="11" placeholder="DNI (solo números)"
          style="flex:1;min-width:0;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px">
        <select id="bcraSexo" style="padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px">
          <option value="">Sexo: ?</option><option value="M">M</option><option value="F">F</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="bcraBtn" style="margin-top:8px" onclick="consultarBCRA()">🔎 Consultar Central de Deudores</button>
      <div id="bcraRes" style="margin-top:10px;font-size:13px"></div>
    </div>
  </div>

  <!-- CLIENTES -->
  <div id="secClientes" class="section">
    <div id="clientesContent"></div>
  </div>



  <!-- HERRAMIENTAS -->
  <div id="secHerramientas" class="section">
    <div id="herramientasContent"></div>
  </div>
</main>

<!-- NAV -->
<nav id="navBar" style="display:none">
  <button class="nav-btn active" id="nav-clientes" onclick="showSection('clientes')">
    <span class="icon">👤</span>Clientes
  </button>

  <button class="nav-btn" id="nav-herramientas" onclick="showSection('herramientas')">
    <span class="icon">🧮</span>Más
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const CLIENT_ID = '121946157210-u52iu7th5ihvkl2bej3iaunrdvdh245g.apps.googleusercontent.com';
const SCOPES    = 'https://www.googleapis.com/auth/drive.readonly';
const DB_NAME   = 'financiera_principal.db';
const FOLDER_ID = '1dofNTHIM3IHDivPQXegJWlAlYkKhwIHg';

let DB = null, SQL = null, accessToken = null, driveFileId = null;
let currentSection = 'clientes';

initSqlJs({ locateFile: f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` })
  .then(sql=>{ SQL=sql; });

// ── UTILS ──────────────────────────────────────────────
function toast(msg, dur=2600) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
function setProgress(msg,pct) {
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('progressMsg').textContent=msg;
  document.getElementById('progressFill').style.width=pct+'%';
}
function fmt(n,sym='$'){ return sym+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
// BUGFIX 2026-11-05: antes usaba toISOString() (hora UTC). En Argentina (UTC-3),
// desde las 21:00 "hoy" ya era el día siguiente: la mora se calculaba con un día
// de más y las cuotas que vencen mañana figuraban como vencidas. Ahora usa la
// fecha local del teléfono.
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ── NAV ────────────────────────────────────────────────
function showSection(sec) {
  currentSection = sec;
  ['clientes','herramientas'].forEach(s=>{
    document.getElementById('sec'+cap(s)).classList.toggle('active', s===sec);
    document.getElementById('nav-'+s).classList.toggle('active', s===sec);
  });
  if(sec==='clientes') renderClientes();

  if(sec==='herramientas') renderHerramientas();
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function activarApp() {
  document.getElementById('secLogin').classList.remove('active');
  document.getElementById('navBar').style.display='flex';
  showSection('clientes');
}

// ── CONSULTA BCRA POR DNI (AGREGADO 2026-11-04, a pedido de Waldo) ─────
// Misma lógica que el sistema de escritorio: se calculan los CUILs
// posibles desde el DNI (Módulo 11) y se prueban uno por uno contra la
// Central de Deudores del BCRA (API pública, sin clave). La consulta sale
// directo del navegador de quien usa la página: no pasa por ningún
// servidor propio y no usa ni expone ninguna clave.
function bcraCuils(dni, sexo) {
  const pref = sexo==='M'?['20','23','24'] : sexo==='F'?['27','23'] : ['20','27','23','24'];
  const pesos=[5,4,3,2,7,6,5,4,3,2], out=[];
  for(const p of pref){
    const base=p+String(dni).padStart(8,'0');
    let suma=0; for(let i=0;i<10;i++) suma+=Number(base[i])*pesos[i];
    const resto=suma%11; let ver;
    if(resto===0) ver=0; else if(resto===1) ver=(p==='27')?9:null; else ver=11-resto;
    if(ver!==null) out.push(base+ver);
  }
  return out;
}
function escH(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function consultarBCRA() {
  const dni=document.getElementById('bcraDni').value.replace(/\D/g,'');
  const sexo=document.getElementById('bcraSexo').value;
  const out=document.getElementById('bcraRes'), btn=document.getElementById('bcraBtn');
  if(dni.length<7||dni.length>8){ out.innerHTML='<span style="color:#EF5350">Ingresá un DNI de 7 u 8 dígitos.</span>'; return; }
  const BASE='https://api.bcra.gob.ar/centraldedeudores/v1.0';
  btn.disabled=true; out.innerHTML='<span style="color:var(--muted)">Consultando BCRA...</span>';
  try {
    let data=null, cuil=null, limite=false;
    const cuils=bcraCuils(dni,sexo);
    for(let i=0;i<cuils.length;i++){
      if(i>0) await new Promise(r=>setTimeout(r,600));
      out.innerHTML='<span style="color:var(--muted)">Consultando CUIL '+escH(cuils[i])+'...</span>';
      const r=await fetch(BASE+'/Deudas/'+cuils[i]);
      if(r.status===200){ data=await r.json(); cuil=cuils[i]; break; }
      if(r.status===404) continue;
      if(r.status===429){ limite=true; break; }
    }
    if(limite){ out.innerHTML='<span style="color:#FFA726">El BCRA alcanzó el límite de consultas por ahora (error 429). Probá de nuevo en unos minutos.</span>'; return; }
    if(!data){ out.innerHTML='<div style="color:#4CAF50;font-weight:700">✅ DNI '+escH(dni)+' no figura en la Central de Deudores.</div><div style="color:var(--muted);margin-top:4px">No registra deudas en el sistema financiero formal.</div>'; return; }
    let cheques=[];
    try{ const rc=await fetch(BASE+'/ChequesRechazados/'+cuil); if(rc.status===200){ const j=await rc.json(); cheques=(j.results&&j.results.entidades)||[]; } }catch(e){}
    const res=data.results||{}, periodos=res.periodos||[];
    let sitMax=1; periodos.forEach(p=>(p.entidades||[]).forEach(e=>{ if(Number.isInteger(e.situacion)&&e.situacion>sitMax) sitMax=e.situacion; }));
    const desc={1:'Normal',2:'Con seguimiento especial',3:'Con problemas',4:'Con alto riesgo de insolvencia',5:'Irrecuperable'}[sitMax]||'?';
    const col={1:'#4CAF50',2:'#FFA726',3:'#FF7043',4:'#EF5350',5:'#B71C1C'}[sitMax]||'#607D8B';
    let h='<div style="font-weight:700;font-size:15px">'+escH(res.denominacion||'')+'</div>'
        +'<div style="color:var(--muted);font-size:12px">CUIL '+escH(cuil.slice(0,2)+'-'+cuil.slice(2,10)+'-'+cuil.slice(10))+' · DNI '+escH(dni)+'</div>';
    if(!periodos.length){
      h+='<div style="color:#4CAF50;margin-top:8px;font-weight:700">✅ Sin deudas registradas</div>';
    } else {
      h+='<div style="margin-top:8px;font-weight:700;color:'+col+'">Situación máxima: '+sitMax+' — '+escH(desc)+'</div>';
      periodos.slice(0,3).forEach(p=>{
        h+='<div style="margin-top:8px;color:var(--muted);font-size:12px">Período '+escH(p.periodo||'?')+'</div>';
        (p.entidades||[]).forEach(e=>{
          h+='<div style="padding:4px 0;border-bottom:1px solid var(--border)">'+escH(e.entidad||'?')
            +' · Sit. '+escH(e.situacion)+' · $'+Number((e.monto||0)*1000).toLocaleString('es-AR')+'</div>';
        });
      });
      h+='<div style="margin-top:4px;color:var(--muted);font-size:11px">Montos en pesos (el BCRA los informa en miles).</div>';
    }
    h+= cheques.length ? '<div style="margin-top:8px;color:#EF5350;font-weight:700">⚠️ Cheques rechazados: '+cheques.length+'</div>'
                       : '<div style="margin-top:8px;color:#4CAF50">Sin cheques rechazados</div>';
    out.innerHTML=h;
  } catch(e){
    out.innerHTML='<span style="color:#EF5350">No se pudo conectar con el BCRA desde el navegador ('+escH(e.message||e)+'). Puede ser tu conexión o que el BCRA no permita la consulta desde esta página.</span>';
  } finally { btn.disabled=false; }
}

// ── GOOGLE AUTH ────────────────────────────────────────
function iniciarGoogle() {
  // AGREGADO 2026-11-04, a pedido de Waldo: recordar con qué cuenta se
  // conectó la última vez y pasársela a Google como sugerencia (hint),
  // para que no muestre el selector de cuentas cada vez que se abre la
  // página teniendo varias sesiones de Google en el navegador.
  let hint='';
  try { hint=localStorage.getItem('gm_google_hint')||''; } catch(e){}
  const cfg={
    client_id: CLIENT_ID, scope: SCOPES,
    callback: async(resp)=>{
      if(resp.error){ toast('❌ Error de autenticación'); return; }
      accessToken=resp.access_token;
      // Guardar el mail de la cuenta (no bloquea ni afecta el flujo si falla)
      fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',
        {headers:{Authorization:'Bearer '+accessToken}})
        .then(r=>r.json()).then(d=>{
          const em=d&&d.user&&d.user.emailAddress;
          if(em){ try{ localStorage.setItem('gm_google_hint',em); }catch(e){} }
        }).catch(()=>{});
      setProgress('Buscando base de datos...', 20);
      await buscarDBenDrive();
    }
  };
  if(hint) cfg.hint=hint;
  const client = google.accounts.oauth2.initTokenClient(cfg);
  client.requestAccessToken();
}

async function buscarDBenDrive() {
  try {
    const q=encodeURIComponent(`name='${DB_NAME}' and '${FOLDER_ID}' in parents and trashed=false`);
    const res=await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime)`,
      {headers:{Authorization:`Bearer ${accessToken}`}});
    const data=await res.json();
    if(!data.files||!data.files.length){ toast('❌ No encontré '+DB_NAME); setProgress('No encontrado',0); return; }
    driveFileId=data.files[0].id;
    const mod=new Date(data.files[0].modifiedTime);
    document.getElementById('syncInfo').innerHTML=
      `✓ Drive<br>${mod.toLocaleDateString('es-AR')} ${mod.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`;
    await descargarDB(driveFileId);
  } catch(e){ toast('❌ Error al buscar en Drive'); }
}

async function descargarDB(fileId) {
  try {
    setProgress('Descargando...', 55);
    const res=await fetch(
      `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
      {headers:{Authorization:`Bearer ${accessToken}`}, cache:'no-store'});
    setProgress('Procesando...', 85);
    DB=new SQL.Database(new Uint8Array(await res.arrayBuffer()));
    setProgress('¡Listo!', 100);
    setTimeout(()=>activarApp(), 400);
    toast('✅ Base cargada desde Drive');
  } catch(e){ toast('❌ Error al descargar'); }
}

async function refrescarDrive() {
  if(!accessToken||!driveFileId){ toast('Primero conectá con Google'); return; }
  toast('🔄 Actualizando...');
  await descargarDB(driveFileId);
}

function cargarDBArchivo(event) {
  const file=event.target.files[0]; if(!file) return;
  setProgress('Leyendo...', 40);
  const reader=new FileReader();
  reader.onload=e=>{
    try {
      DB=new SQL.Database(new Uint8Array(e.target.result));
      const mod=new Date(file.lastModified);
      document.getElementById('syncInfo').innerHTML=
        `✓ ${file.name}<br>${mod.toLocaleDateString('es-AR')} ${mod.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`;
      setProgress('¡Listo!',100);
      setTimeout(()=>activarApp(),400);
      toast('✅ Base cargada');
    } catch(e){ toast('❌ Archivo inválido'); }
  };
  reader.readAsArrayBuffer(file);
}

}

function cargarCuotas(pid) {
  const wrap=document.querySelector(`#det-${pid}`);
  const h=hoy();
  const pr=DB.exec(`SELECT moneda FROM prestamos WHERE id=?`,[pid]);
  const moneda=pr[0].values[0][0]; const sym=moneda==='USD'?'U$S ':'$';

  // BUGFIX 2026-11-05: mora copiada del sistema de escritorio (abrir_ventana_cobro):
  // tasa por defecto = configuracion 'tasa_mora_diaria_default'; tasa propia del
  // credito (tasa_mora_custom); pausa (mora_pausada: sin fecha = ELIMINAR, con
  // fecha = CONGELAR); y reconstruccion tramo por tramo entre pagos, arrastrando
  // el deficit de mora no cobrada.
  let MORA_DIARIA=1, moraPausada=false, moraCongel=null;
  try{
    const tr=DB.exec(`SELECT valor FROM configuracion WHERE clave='tasa_mora_diaria_default'`);
    if(tr.length&&tr[0].values.length&&tr[0].values[0][0]!==null&&tr[0].values[0][0]!==''){const v=parseFloat(tr[0].values[0][0]); if(!isNaN(v)) MORA_DIARIA=v;}
  }catch(e){}
  try{
    const pm=DB.exec(`SELECT tasa_mora_custom, mora_pausada, mora_congelada_fecha FROM prestamos WHERE id=?`,[pid]);
    if(pm.length&&pm[0].values.length){
      const[tc,mp,mf]=pm[0].values[0];
      if(tc!==null&&tc!==undefined&&tc!==''&&!isNaN(parseFloat(tc))) MORA_DIARIA=parseFloat(tc);
      moraPausada=!!mp; moraCongel=mf?String(mf).slice(0,10):null;
    }
  }catch(e){}
  const pagosPorCuota={};
  try{
    const pg=DB.exec(`SELECT p.cuota_id,p.fecha_real_pago,p.monto_pagado,p.mora_cobrada FROM pagos p JOIN cuotas c ON c.id=p.cuota_id WHERE c.prestamo_id=? ORDER BY p.fecha_real_pago ASC, p.id ASC`,[pid]);
    if(pg.length) pg[0].values.forEach(x=>{(pagosPorCuota[x[0]]=pagosPorCuota[x[0]]||[]).push(x);});
  }catch(e){}
  const dDias=(a,b)=>{const pa=a.split('-'),pb=b.split('-');return Math.round((Date.UTC(+pb[0],+pb[1]-1,+pb[2])-Date.UTC(+pa[0],+pa[1]-1,+pa[2]))/86400000);};
  const calcMora=(cid,fv,monto)=>{
    if(!fv) return 0;
    let tope;
    if(moraPausada&&!moraCongel) return 0;
    else if(moraPausada&&moraCongel) tope=moraCongel; else tope=h;
    let cursor=fv.slice(0,10), saldoC=+monto||0, acum=0;
    (pagosPorCuota[cid]||[]).forEach(x=>{
      const fp=x[1]?String(x[1]).slice(0,10):null; if(!fp) return;
      const dt=dDias(cursor,fp);
      if(dt>0) acum+=saldoC*(MORA_DIARIA/100)*dt;
      acum-=(x[3]||0);
      saldoC-=((x[2]||0)-(x[3]||0));
      if(fp>cursor) cursor=fp;
    });
    const df=dDias(cursor,tope);
    if(df>0) acum+=saldoC*(MORA_DIARIA/100)*df;
    acum=Math.max(0,acum);
    return moneda==='USD'?Math.round(acum):Math.round(acum/100)*100;
  };

  const cuotas=DB.exec(`
    SELECT c.numero_cuota,c.fecha_vencimiento,c.monto_cuota,c.estado,
           COALESCE((SELECT SUM(p.monto_pagado - p.mora_cobrada) FROM pagos p WHERE p.cuota_id=c.id),0) cobrado,
           (SELECT MAX(p.fecha_real_pago) FROM pagos p WHERE p.cuota_id=c.id) ultimo_pago, c.id cid
    FROM cuotas c WHERE c.prestamo_id=? ORDER BY c.numero_cuota`,[pid]);
  if(!cuotas.length||!cuotas[0].values.length){ wrap.innerHTML='<div class="empty">Sin cuotas</div>'; return; }
  const rows=cuotas[0].values;
  let tPag=0,tPend=0,venc=0,venceHoy=0;
  rows.forEach(r=>{
    const[,fv,m,est,cob,up,cid]=r;
    tPag+=cob||0;
    // BUGFIX 2026-11-05: las cuotas CANCELADO (ej. de un crédito refinanciado) se
    // contaban como pendientes y inflaban el saldo del cliente. El sistema de
    // escritorio también las excluye.
    if(est!=='PAGADO'&&est!=='FINALIZADO'&&est!=='CANCELADO'){
      const saldo=Math.max(0,(m||0)-(cob||0));
      const mora=calcMora(cid,fv,m);
      tPend+=saldo+mora;
      // AJUSTADO 2026-10-29, a pedido de Waldo ("no tengo forma de ver
      // los que vencen en el dia actual.. solo me muestra los
      // vencidos"): antes solo se contaba fv<h (estrictamente antes de
      // hoy) — una cuota que vence HOY no entraba en ningún contador ni
      // badge, quedaba mezclada como "PENDIENTE" entre las futuras. Se
      // separa en su propio contador.
      if(fv&&fv<h) venc++;
      else if(fv===h && saldo>0) venceHoy++; // solo si todavía tiene saldo (no contar las ya cubiertas)
    }
  });
  const cc=DB.exec(`SELECT COALESCE(SUM(c.capital_puro)-SUM(COALESCE((SELECT SUM(p.capital_cubierto) FROM pagos p WHERE p.cuota_id=c.id),0)),0) FROM cuotas c WHERE c.prestamo_id=? AND c.estado NOT IN ('PAGADO','FINALIZADO','CANCELADO')`,[pid]);
  const enCalle=cc[0]?.values[0][0]||0;
  const prox=DB.exec(`SELECT fecha_vencimiento,monto_cuota,numero_cuota FROM cuotas WHERE prestamo_id=? AND estado='PENDIENTE' ORDER BY numero_cuota LIMIT 1`,[pid]);
  let proxHTML='';
  if(prox.length&&prox[0].values.length){
    const[fv,mc,nc]=prox[0].values[0];
    const dias=Math.ceil((new Date(fv)-new Date(h))/86400000);
    const col=dias<0?'danger':dias<=3?'accent':'ok';
    const lbl=dias<0?`${Math.abs(dias)}d vencida`:dias===0?'HOY':`en ${dias}d`;
    proxHTML=`<div class="res-item" style="grid-column:1/-1">
      <div class="res-label">Próx. vencimiento — cuota ${nc}</div>
      <div class="res-val ${col}">${fv} (${lbl})</div>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">${sym}${Number(mc).toLocaleString('es-AR')}</div>
    </div>`;
  }
  wrap.innerHTML=`<div style="padding:12px 15px">
    <div class="res-grid">
      <div class="res-item"><div class="res-label">Cobrado</div><div class="res-val ok">${sym}${Number(tPag).toLocaleString('es-AR')}</div></div>
      <div class="res-item"><div class="res-label">Pendiente</div><div class="res-val ${venc>0?'danger':'accent'}">${sym}${Number(tPend).toLocaleString('es-AR')}</div></div>
      <div class="res-item"><div class="res-label">Capital en calle</div><div class="res-val accent">${sym}${Number(enCalle).toLocaleString('es-AR')}</div></div>
      <div class="res-item"><div class="res-label">Cuotas vencidas</div><div class="res-val ${venc>0?'danger':'ok'}">${venc}</div></div>
      <div class="res-item"><div class="res-label">Vencen hoy</div><div class="res-val" style="color:${venceHoy>0?'#FFD54F':'var(--ok)'}">${venceHoy}</div></div>
      ${proxHTML}
    </div>
    <div style="font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">Detalle</div>
    ${rows.map(r=>{
      const[num,fv,m,est,cobrado,ultimoPago,cid]=r;
      const saldo=Math.max(0,(m||0)-(cobrado||0));
      const fechaBase=fv;
      const diasAtraso=fv?dDias(fv,h):0;
      const moraCalc=(est!=='PAGADO'&&est!=='FINALIZADO'&&est!=='CANCELADO')?calcMora(cid,fv,m):0;
      const totCRec=saldo+moraCalc;
      // AJUSTADO 2026-10-29: se agrega el caso fv===h ("vence hoy") antes
      // de VENCIDA, para que una cuota que vence hoy no quede escondida
      // como PENDIENTE junto a las futuras.
      const est2=est==='PAGADO'?'PAGADO':est==='FINALIZADO'?'PAGADO':est==='CANCELADO'?'CANCELADA':(fv&&fv<h)?'VENCIDA':(fv===h&&saldo>0)?'HOY':cobrado>0?'PARCIAL':'PENDIENTE';
      const bc={'PAGADO':'badge-ok','VENCIDA':'badge-venc','HOY':'badge-hoy','PARCIAL':'badge-parc','PENDIENTE':'badge-pend','CANCELADA':'badge-grey'}[est2];

      let saldoLine='';
      if(cobrado>0&&est2!=='PAGADO'){
        saldoLine=`<div style="font-size:11px;color:var(--muted);margin-top:1px">
          Cobrado: ${sym}${Number(cobrado).toLocaleString('es-AR')} · Saldo: ${sym}${Number(saldo).toLocaleString('es-AR')}
        </div>`;
      }

      let recLine='';
      if(moraCalc>0&&est2!=='PAGADO'){
        recLine=`<div style="font-size:12px;font-weight:700;color:var(--accent2);margin-top:3px">
          C/recargo: ${sym}${Number(totCRec).toLocaleString('es-AR')}
          <span style="font-weight:400;font-size:10px;color:var(--muted)">(+${sym}${Number(moraCalc).toLocaleString('es-AR')} · ${diasAtraso}d desde ${fechaBase})</span>
        </div>`;
      }

      return `<div class="cuota-row">
        <div class="cuota-num">${num}</div>
        <div class="cuota-info">
          <div class="cuota-venc">${fv||'—'}</div>
          <div class="cuota-monto-txt">${sym}${Number(m).toLocaleString('es-AR')}</div>
          ${saldoLine}${recLine}
        </div>
        <div class="badge ${bc}">${est2}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function verVencidas() {
  const h=hoy();
  const res=DB.exec(`
    SELECT cl.apellido,cl.nombre,cl.telefono,c.fecha_vencimiento,c.monto_cuota,c.numero_cuota,pr.moneda,cl.id,
           COALESCE((SELECT SUM(p.monto_pagado) FROM pagos p WHERE p.cuota_id=c.id),0) pagado,
           COALESCE((SELECT SUM(p.mora_cobrada) FROM pagos p WHERE p.cuota_id=c.id),0) mora
    FROM cuotas c JOIN prestamos pr ON c.prestamo_id=pr.id JOIN clientes cl ON pr.cliente_id=cl.id
    WHERE c.estado NOT IN ('PAGADO','FINALIZADO','CANCELADO')
      AND pr.estado NOT IN ('FINALIZADO','CANCELADO','EN_ESPERA','VENDIDO','INCOBRABLE','COMPLETADO','EN_JUICIO')
      AND c.fecha_vencimiento<=? ORDER BY c.fecha_vencimiento ASC LIMIT 60`,[h]);
  const el=document.getElementById('clientesContent');
  el.innerHTML=`<div class="back-btn" onclick="renderClientes()">‹ Volver</div>`;
  const card=document.createElement('div'); card.className='card';
  if(!res.length||!res[0].values.length){
    card.innerHTML=`<div class="card-title">⚠️ Cuotas vencidas</div><div class="empty"><div class="empty-icon">🎉</div>¡Sin cuotas vencidas!</div>`;
  } else {
    const filas=res[0].values.filter(r=>Math.max(0,(r[4]||0)-((r[8]||0)-(r[9]||0)))>0);
    if(!filas.length){
      card.innerHTML=`<div class="card-title">⚠️ Cuotas vencidas</div><div class="empty"><div class="empty-icon">🎉</div>¡Sin cuotas vencidas!</div>`;
      el.appendChild(card);
      return;
    }
    card.innerHTML=`<div class="card-title">⚠️ ${filas.length} cuota(s) vencida(s)</div>`;
    filas.forEach(r=>{
      const[ape,nom,tel,fv,m,nc,moneda,cid,pag,mora]=r;
      const sym=moneda==='USD'?'U$S ':'$';
      const saldo=Math.max(0,(m||0)-((pag||0)-(mora||0)));
      const dias=Math.ceil((new Date(h)-new Date(fv))/86400000);
      card.innerHTML+=`<div class="list-item" onclick="verCliente(${cid})" style="flex-direction:column;align-items:flex-start;gap:3px">
        <div style="display:flex;width:100%"><b>${ape} ${nom}</b><span style="margin-left:auto;font-size:11px;color:var(--danger);font-family:var(--mono)">${dias}d</span></div>
        <div style="font-size:12px;color:var(--muted)">Cuota ${nc} · ${fv}</div>
        <div style="font-size:14px;font-weight:700;color:var(--danger)">${sym}${Number(saldo).toLocaleString('es-AR')} pendiente</div>
        ${tel?`<div style="font-size:12px;color:var(--accent)">📞 ${tel}</div>`:''}
      </div>`;
    });
  }
  el.appendChild(card);
}

// AGREGADO 2026-10-30, a pedido de Waldo: botón "Vencen hoy" — lista SOLO
// las cuotas cuyo vencimiento es exactamente hoy (a diferencia de
// verVencidas, que mezcla las de hoy con las atrasadas).
function verVencenHoy() {
  const h=hoy();
  const res=DB.exec(`
    SELECT cl.apellido,cl.nombre,cl.telefono,c.fecha_vencimiento,c.monto_cuota,c.numero_cuota,pr.moneda,cl.id,
           COALESCE((SELECT SUM(p.monto_pagado) FROM pagos p WHERE p.cuota_id=c.id),0) pagado
    FROM cuotas c JOIN prestamos pr ON c.prestamo_id=pr.id JOIN clientes cl ON pr.cliente_id=cl.id
    WHERE c.estado NOT IN ('PAGADO','FINALIZADO','CANCELADO')
      AND pr.estado NOT IN ('FINALIZADO','CANCELADO','EN_ESPERA','VENDIDO','INCOBRABLE','COMPLETADO','EN_JUICIO')
      AND c.fecha_vencimiento=? ORDER BY cl.apellido ASC LIMIT 100`,[h]);
  const el=document.getElementById('clientesContent');
  el.innerHTML=`<div class="back-btn" onclick="renderClientes()">‹ Volver</div>`;
  const card=document.createElement('div'); card.className='card';
  const filas=(res.length&&res[0].values.length)?res[0].values.filter(r=>Math.max(0,(r[4]||0)-(r[8]||0))>0):[];
  if(!filas.length){
    card.innerHTML=`<div class="card-title">📆 Vencen hoy</div><div class="empty"><div class="empty-icon">🎉</div>¡No hay cuotas que venzan hoy!</div>`;
  } else {
    card.innerHTML=`<div class="card-title">📆 ${filas.length} cuota(s) vencen hoy</div>`;
    filas.forEach(r=>{
      const[ape,nom,tel,fv,m,nc,moneda,cid,pag]=r;
      const sym=moneda==='USD'?'U$S ':'$';
      const saldo=Math.max(0,(m||0)-(pag||0));
      card.innerHTML+=`<div class="list-item" onclick="verCliente(${cid})" style="flex-direction:column;align-items:flex-start;gap:3px">
        <div style="display:flex;width:100%"><b>${ape} ${nom}</b><span class="badge badge-hoy" style="margin-left:auto">HOY</span></div>
        <div style="font-size:12px;color:var(--muted)">Cuota ${nc} · ${fv}</div>
        <div style="font-size:14px;font-weight:700;color:#FFD54F">${sym}${Number(saldo).toLocaleString('es-AR')} a cobrar</div>
        ${tel?`<div style="font-size:12px;color:var(--accent)">📞 ${tel}</div>`:''}
      </div>`;
    });
  }
  el.appendChild(card);
}

// ── LISTA DE ESPERA ────────────────────────────────────
function verEspera() {
  const el=document.getElementById('herramientasContent');
  el.innerHTML=`<div class="back-btn" onclick="renderHerramientas()">‹ Volver</div>`;
  // AJUSTADO 2026-11-05: igual que el sistema de escritorio — UNA sola lista con
  // créditos e ítems mezclados, solo PENDIENTES (estado='PENDIENTE' / EN_ESPERA;
  // antes se mostraba todo lo que no fuera COMPLETADO y aparecían compras de USD
  // ya terminadas) y ordenada por fecha límite ascendente (si no tiene, la de
  // creación): lo que vence antes arriba.
  const filas=[];
  const ord=f=>{ if(!f) return 0; const m=String(f).slice(0,10).split('-'); return Date.UTC(+m[0],(+m[1]||1)-1,+m[2]||1)/86400000; };
  const esc=t=>String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // ── CRÉDITOS EN ESPERA ──
  const creditos=DB.exec(`
    SELECT pr.id, cl.apellido||' '||cl.nombre nombre, cl.telefono,
           pr.monto_prestado, pr.moneda, pr.cantidad_cuotas,
           pr.tipo_sistema, pr.frecuencia, pr.fecha_inicio, pr.observaciones,
           pr.monto_entregado, pr.fecha_limite, pr.alias_cbu
    FROM prestamos pr JOIN clientes cl ON pr.cliente_id=cl.id
    WHERE pr.estado='EN_ESPERA'`);
  if(creditos.length) creditos[0].values.forEach(r=>{
    const[id,nom,tel,monto,moneda,cuotas,sistema,freq,fecha,obs,entregado,flim,alias]=r;
    const sym=moneda==='USD'?'U$S ':'$';
    const cub=entregado||0;
    const faltante=Math.max(0,(monto||0)-cub);
    const pct=monto>0?Math.min(100,(cub/monto)*100):0;
    filas.push({k:ord(flim||fecha),h:`<div class="espera-item">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">CRÉDITO #${id} · ${fecha?fecha.slice(0,10):'—'}${flim?' · límite '+String(flim).slice(0,10):''}</div>
            <div style="font-weight:600;font-size:15px;margin-top:2px">${esc(nom)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">${cuotas} cuotas · ${sistema||''} · ${freq||''}</div>
            ${tel?`<div style="font-size:12px;color:var(--accent)">📞 ${tel}</div>`:''}
            ${obs?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(obs)}</div>`:''}
            ${alias?`<div style="font-size:12px;color:var(--accent);margin-top:3px;word-break:break-all" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(alias).replace(/'/g,'')}')">🏦 ${esc(alias)}${''}</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:10px">
            <div style="font-weight:700;font-size:16px;color:var(--accent2)">${sym}${Number(monto||0).toLocaleString('es-AR')}</div>
            <div style="font-size:11px;color:var(--ok);margin-top:2px">✓ ${sym}${Number(cub).toLocaleString('es-AR')}</div>
            ${faltante>0?`<div style="font-size:11px;color:var(--danger)">Falta: ${sym}${Number(faltante).toLocaleString('es-AR')}</div>`:''}
            <div class="badge badge-parc" style="margin-top:4px">EN ESPERA</div>
          </div>
        </div>
        <div class="espera-prog"><div class="espera-fill" style="width:${pct}%"></div></div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px;text-align:right">${pct.toFixed(0)}% fondeado</div>
      </div>`});
  });

  // ── GASTOS / PAGOS / COMPRAS EN ESPERA ──
  let items=[];
  try{
    items=DB.exec(`
      SELECT id,tipo,descripcion,monto_total,monto_cubierto,moneda_pago,
             fecha_creacion,estado,observaciones,fecha_limite,alias_cbu,alias_titular
      FROM items_espera
      WHERE estado='PENDIENTE'`);
  }catch(e){
    items=DB.exec(`SELECT id,tipo,descripcion,monto_total,monto_cubierto,moneda_pago,fecha_creacion,estado,observaciones,NULL,alias_cbu,NULL FROM items_espera WHERE estado='PENDIENTE'`);
  }
  const tipoMapa={GASTO:'GASTO',COMPRA_USD:'COMPRA USD',PAGO_INVERSOR:'PAGO INVERSOR',INVERSION_PROPIA:'INV. PROPIA',APORTE_INV_PROPIA:'APORTE INV. PROPIA'};
  if(items.length) items[0].values.forEach(r=>{
    const[id,tipo,desc,total,cub,moneda,fecha,estado,obs,flim,alias,titular]=r;
    const pct=total>0?Math.min(100,((cub||0)/total)*100):0;
    const sym=moneda==='USD'?'U$S ':'$';
    const faltante=Math.max(0,(total||0)-(cub||0));
    const pagos=DB.exec(`
      SELECT g.fecha, g.monto, g.moneda, g.descripcion
      FROM gastos g
      WHERE g.categoria='ENTREGA_ESPERA' AND g.descripcion LIKE '%#${id}%'
      ORDER BY g.fecha ASC`);
    let detalleHTML='';
    if(pagos.length&&pagos[0].values.length){
      const filasPag=pagos[0].values.map(p=>{
        const [pfecha,pmonto,pmon]=p;
        const psym=pmon==='USD'?'U$S ':'$';
        return `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:2px 0;border-bottom:1px solid var(--border)">
            <span>${pfecha?pfecha.slice(0,10):'—'}</span>
            <span style="color:var(--ok);font-weight:600">${psym}${Number(pmonto).toLocaleString('es-AR')}</span>
          </div>`;
      }).join('');
      detalleHTML=`<div style="margin-top:6px;padding:6px 8px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Entregas recibidas</div>
          ${filasPag}
        </div>`;
    }
    filas.push({k:ord(flim||fecha),h:`<div class="espera-item">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div style="font-size:11px;color:var(--muted);font-family:var(--mono)">#${id} · ${fecha?fecha.slice(0,10):'—'} · ${tipoMapa[tipo]||tipo||'—'}${flim?' · límite '+String(flim).slice(0,10):''}</div>
            <div style="font-weight:600;font-size:14px;margin-top:2px">${esc(desc)||'—'}</div>
            ${obs?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(obs)}</div>`:''}
            ${alias?`<div style="font-size:12px;color:var(--accent);margin-top:3px;word-break:break-all" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(alias).replace(/'/g,'')}')">🏦 ${esc(alias)}${titular?' · '+esc(titular):''}</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0;margin-left:10px">
            <div style="font-weight:700;color:var(--accent2)">${sym}${Number(total||0).toLocaleString('es-AR')}</div>
            <div style="font-size:11px;color:var(--ok)">✓ ${sym}${Number(cub||0).toLocaleString('es-AR')}</div>
            ${faltante>0?`<div style="font-size:11px;color:var(--danger)">Falta: ${sym}${Number(faltante).toLocaleString('es-AR')}</div>`:''}
          </div>
        </div>
        <div class="espera-prog"><div class="espera-fill" style="width:${pct}%"></div></div>
        <div style="font-size:10px;color:var(--muted);margin-top:3px;text-align:right">${pct.toFixed(0)}% cubierto · ${estado||'PENDIENTE'}</div>
        ${detalleHTML}
      </div>`});
  });

  filas.sort((a,b)=>a.k-b.k);
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="card-title">⏳ Lista de espera</div>`+(filas.length
    ? `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">${filas.length} pendiente(s) · primero lo que vence antes</div>`+filas.map(f=>f.h).join('')
    : `<div class="empty" style="padding:16px"><div class="empty-icon">✅</div>Sin pendientes</div>`);
  el.appendChild(card);
}

function verPagares() {
  const el=document.getElementById('herramientasContent');
  el.innerHTML=`<div class="back-btn" onclick="renderHerramientas()">‹ Volver</div>`;
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<div class="card-title">📄 Estado de pagarés</div>
    <div class="pill-row">
      <div class="pill on"  onclick="filtrarPagares('PARA LLEVAR',this)">Para llevar</div>
      <div class="pill"     onclick="filtrarPagares('EN OFICINA',this)">En oficina</div>
      <div class="pill"     onclick="filtrarPagares('EN CAJA SEG',this)">Caja seg.</div>
      <div class="pill"     onclick="filtrarPagares('TRAER',this)">Traer</div>
      <div class="pill"     onclick="filtrarPagares('ENTREGADO',this)">Entregado</div>
      <div class="pill"     onclick="filtrarPagares('ROTO',this)">Roto</div>
      <div class="pill"     onclick="filtrarPagares('SIN PAGARE',this)">Sin pagaré</div>
    </div>
    <div id="pagaresLista"></div>`;
  el.appendChild(card);
  filtrarPagares('PARA LLEVAR', null);
}

function filtrarPagares(estado, pill) {
  if(pill){ document.querySelectorAll('.pill-row .pill').forEach(p=>p.classList.remove('on')); pill.classList.add('on'); }
  const res=DB.exec(`
    SELECT p.id, cl.apellido||' '||cl.nombre nombre, cl.dni, p.estado_pagare, p.monto_prestado, p.moneda, p.fecha_inicio
    FROM prestamos p JOIN clientes cl ON p.cliente_id=cl.id
    WHERE UPPER(COALESCE(p.estado_pagare,'PARA LLEVAR'))=? AND p.estado!='CANCELADO'
    ORDER BY p.id DESC`,[estado.toUpperCase()]);
  const lista=document.getElementById('pagaresLista');
  if(!res.length||!res[0].values.length){ lista.innerHTML='<div class="empty"><div class="empty-icon">📄</div>Sin pagarés en este estado</div>'; return; }
  const claseMap={'PARA LLEVAR':'pe-llevar','EN OFICINA':'pe-llevar','EN CAJA SEG':'pe-firmado','TRAER':'pe-cliente','ENTREGADO':'pe-firmado','ROTO':'pe-perdido','SIN PAGARE':'badge-grey'};
  lista.innerHTML=res[0].values.map(r=>{
    const[id,nom,dni,est,monto,moneda,fecha]=r;
    const sym=moneda==='USD'?'U$S ':'$';
    const cls=claseMap[est?.toUpperCase()]||'pe-llevar';
    return `<div class="pagare-item">
      <span class="pagare-estado ${cls}">${est||'PARA LLEVAR'}</span>
      <div style="font-weight:600;font-size:14px">${nom}</div>
      <div style="font-size:12px;color:var(--muted);font-family:var(--mono)">DNI ${dni||'—'} · Crédito #${id}</div>
      <div style="font-size:14px;font-weight:700;color:var(--accent);margin-top:4px">${sym}${Number(monto).toLocaleString('es-AR')}</div>
      <div style="font-size:11px;color:var(--muted)">${fecha?fecha.slice(0,10):'—'}</div>
    </div>`;
  }).join('');
}

// ── COBROS DEL DÍA ────────────────────────────────────
let fechaCobros = hoy();

function verCobrosDelDia() {
  fechaCobros = hoy();
  const el = document.getElementById('clientesContent');
  el.innerHTML = `
    <div class="back-btn" onclick="renderClientes()">‹ Volver</div>
    <div class="card">
      <div class="card-title">📅 Cobros del día</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px">
        <button onclick="cambiarDiaCobros(-1)" style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 16px;font-size:18px;cursor:pointer">◀</button>
        <span id="lblFechaCobros" style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent)"></span>
        <button onclick="cambiarDiaCobros(1)" style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 16px;font-size:18px;cursor:pointer">▶</button>
        <button onclick="fechaCobros=hoy();cargarCobrosDelDia()" style="background:var(--accent);color:#000;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer">HOY</button>
      </div>
      <div id="listaCobros"></div>
    </div>`;
  cargarCobrosDelDia();
}

function cambiarDiaCobros(delta) {
  const d = new Date(fechaCobros + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  fechaCobros = d.toISOString().slice(0, 10);
  cargarCobrosDelDia();
}

function cargarCobrosDelDia() {
  const lista = document.getElementById('listaCobros');
  const lbl = document.getElementById('lblFechaCobros');
  if (!lista || !lbl) return;
  const partes = fechaCobros.split('-');
  lbl.textContent = `${partes[2]}/${partes[1]}/${partes[0]}`;

  const cuentaNom = c => ({'CAJA_CHICA':'Caja chica','CAJA_MAYOR':'Caja mayor'}[c] || (c||'—').replace(/_/g,' '));

  const cobros = DB.exec(`
    SELECT cl.apellido||' '||cl.nombre, cu.numero_cuota, p.monto_pagado, p.cuenta_destino, pr.moneda, pr.id
    FROM pagos p
    JOIN cuotas cu ON p.cuota_id = cu.id
    JOIN prestamos pr ON cu.prestamo_id = pr.id
    JOIN clientes cl ON pr.cliente_id = cl.id
    WHERE date(p.fecha_real_pago) = ?
    ORDER BY p.id DESC`, [fechaCobros]);

  const otorg = DB.exec(`
    SELECT cl.apellido||' '||cl.nombre, pr.id, pr.monto_prestado, pr.cuenta_origen, pr.moneda
    FROM prestamos pr
    JOIN clientes cl ON pr.cliente_id = cl.id
    WHERE pr.fecha_inicio = ? AND pr.estado != 'EN_ESPERA'
    ORDER BY pr.id DESC`, [fechaCobros]);

  const filas = [];

  if (cobros.length && cobros[0].values.length) {
    cobros[0].values.forEach(r => {
      const [nom, nc, monto, cta, moneda] = r;
      const sym = moneda === 'USD' ? 'U$S ' : '$';
      filas.push(`<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px">${nom}</div>
          <div style="font-size:12px;color:var(--muted)">Cobro cuota ${nc} · ${cuentaNom(cta)}</div>
        </div>
        <div style="font-weight:700;color:var(--ok);font-family:var(--mono);white-space:nowrap">${sym}${Number(monto||0).toLocaleString('es-AR')}</div>
      </div>`);
    });
  }

  if (otorg.length && otorg[0].values.length) {
    otorg[0].values.forEach(r => {
      const [nom, pid, monto, cta, moneda] = r;
      const sym = moneda === 'USD' ? 'U$S ' : '$';
      filas.push(`<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px">${nom}</div>
          <div style="font-size:12px;color:var(--accent2)">Otorgamiento crédito #${pid} · ${cuentaNom(cta)}</div>
        </div>
        <div style="font-weight:700;color:var(--danger);font-family:var(--mono);white-space:nowrap">${sym}${Number(monto||0).toLocaleString('es-AR')}</div>
      </div>`);
    });
  }

  if (!filas.length) {
    lista.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>Sin movimientos este día</div>';
  } else {
    lista.innerHTML = `
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${filas.length} movimiento(s)</div>
      ${filas.join('')}`;
  }
}

function calcularFrances() {
  const monto=parseFloat(document.getElementById('simMonto').value)||0;
  const tasa=parseFloat(document.getElementById('simTasa').value)||0;
  const cuotas=parseInt(document.getElementById('simCuotas').value)||0;
  const res=document.getElementById('simResultado');
  if(!monto||!tasa||!cuotas){ res.innerHTML=''; return; }

  const r=tasa/100;
  const cuotaMensual=monto*(r*Math.pow(1+r,cuotas))/(Math.pow(1+r,cuotas)-1);
  const totalPagar=cuotaMensual*cuotas;
  const totalInteres=totalPagar-monto;

  // Tabla de amortización
  let saldo=monto, filas='', capTotal=0, intTotal=0;
  for(let i=1;i<=cuotas;i++){
    const interes=saldo*r;
    const capital=cuotaMensual-interes;
    saldo-=capital;
    capTotal+=capital; intTotal+=interes;
    if(i<=5||i===cuotas){
      filas+=`<tr>
        <td>${i}</td>
        <td>${fmt(cuotaMensual)}</td>
        <td>${fmt(capital)}</td>
        <td>${fmt(interes)}</td>
        <td>${fmt(Math.max(0,saldo))}</td>
      </tr>`;
    }
    if(i===5&&cuotas>6){ filas+=`<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:6px">···</td></tr>`; }
  }

  res.innerHTML=`<div class="sim-result">
    <div style="font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:1px">Cuota mensual</div>
    <div class="sim-cuota-big">${fmt(cuotaMensual)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div class="res-item"><div class="res-label">Total a pagar</div><div class="res-val danger">${fmt(totalPagar)}</div></div>
      <div class="res-item"><div class="res-label">Total intereses</div><div class="res-val accent">${fmt(totalInteres)}</div></div>
    </div>
    <div style="font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Amortización</div>
    <div style="overflow-x:auto">
      <table class="sim-table">
